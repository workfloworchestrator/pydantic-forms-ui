site_name: pydantic-forms-ui
site_description: Generate frontend forms from Pydantic models
repo_url: https://github.com/workfloworchestrator/pydantic-forms-ui

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.indexes
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Tutorials:
      - tutorials/index.md
      - Creating your first form: tutorials/create-first-form.md
      - Styling your form: tutorials/style-your-form.md
  - How-to guides:
      - how-to/index.md
      - Layout: how-to/layout.md
      - Forms: how-to/forms.md
      - Custom fields: how-to/custom-fields.md
  - Reference:
      - reference/index.md
      - Layout: reference/layout.md
      - Custom fields: reference/custom-fields.md
      - Requirements: reference/requirements.md
  - Explanation:
      - explanation/index.md
      - How forms are generated: explanation/forms.md
      - How the layout grid works: explanation/layout-grid.md
